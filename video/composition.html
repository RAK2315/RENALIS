function text(value,x,y,size=26,color=C.ink,font='Segoe UI',weight=400,align='left'){
  value=String(value);ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='alphabetic';

}
function lines(value,x,y,width,size=26,color=C.muted,gap=1.45,font='Segoe UI',weight=400,align='left'){
  ctx.font=`${weight} ${size}px ${font}`;
  const paragraphs=String(value).split('\n');let row=0;
  for(const paragraph of paragraphs){
    let current='';
    for(const word of paragraph.split(/\s+/)){
      const next=current?current+' '+word:word;
      if(ctx.measureText(next).width>width&&current){text(current,x,y+row*size*gap,size,color,font,weight,align);row++;current=word;}
      else current=next;
    }
    if(current){text(current,x,y+row*size*gap,size,color,font,weight,align);row++;}
  }
  return row*size*gap;
}

function panel(key,x,y,w,h,label,t=1){

  text(label,x+83,y+28,15,'#637e51');
  const availableW=w-pad*2,availableH=h-head-pad*2,scale=Math.min(availableW/image.naturalWidth,availableH/image.naturalHeight);

  const ix=x+(w-iw)/2,iy=y+head+pad+(availableH-ih)/2;
  ctx.drawImage(image,ix,iy,iw,ih);
  audit.media.push({key,mode:'contain',source:[image.naturalWidth,image.naturalHeight],destination:[ix,iy,iw,ih],bounds:[x,y,w,h]});

function forecastGraph(x,y,w,h,t,branch=true){

  const px=m=>x+(m-60)/60*w,py=v=>y+h-(v-70)/60*h;
  [80,100,120].forEach(v=>{rule(x,py(v),x+w,py(v),'#d5dfca');text(v,x-24,py(v)+6,20,C.muted,'Segoe UI',400,'right');});

  ctx.beginPath();hist.forEach((r,i)=>i?ctx.lineTo(px(r.minute),py(r.sbp)):ctx.moveTo(px(r.minute),py(r.sbp)));
  ctx.strokeStyle='#6a8161';ctx.lineWidth=4;ctx.stroke();

    ['volume','vascular','cardiac'].forEach((key,i)=>{
      ctx.save();ctx.beginPath();ctx.rect(px(90)-2,y-45,w/2*p+2,h+100);ctx.clip();
      ctx.beginPath();data.trajectories.forEach((r,j)=>j?ctx.lineTo(px(r.minute),py(r[key])):ctx.moveTo(px(r.minute),py(r[key])));
      ctx.strokeStyle=familyColors[i];ctx.lineWidth=4;ctx.stroke();ctx.restore();
      if(p>.98){const last=data.trajectories.at(-1);dot(px(last.minute),py(last[key]),5,familyColors[i]);}

}

function captions(seconds){
  const c=timeline.captions.find(c=>seconds>=c.start&&seconds<c.end+.035);
  if(!c)return;

window.renderFrame=(seconds,options={})=>{
  checking=!!options.audit;audit={errors:[],text:[],media:[],concept:null,caption:null};
  seconds=clamp(seconds,0,timeline.duration-.00001);
  const s=timeline.scenes.find(s=>seconds>=s.start&&seconds<s.start+s.duration)||timeline.scenes.at(-1);
  const index=timeline.scenes.indexOf(s),t=seconds-s.start;
  ctx=main;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;draws[s.id](s,t);
  // Crossfade only before speech starts. Narrated concepts never dissolve away.
  if(t<.42&&index>0){
    const keep=audit,priorChecking=checking;checking=false;ctx=previous;
    const p=timeline.scenes[index-1];ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;draws[p.id](p,p.duration-.01);
    ctx=main;ctx.globalAlpha=1-ease(t/.42);ctx.drawImage(previousCanvas,0,0);ctx.globalAlpha=1;
    audit=keep;checking=priorChecking;

  audit.scene=s.id;audit.time=seconds;window.filmAudit=audit;

};
