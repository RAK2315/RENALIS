<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title description">
<title id="title">RENALIS architecture and evidence boundaries</title><desc id="description">Historical synthetic EHR and available device replay pass through an availability gate into separate Patient twin and Mechanism lab engines. Their outputs feed the research workspace and local audit. A separate observed HEMOBP lane evaluates retrospective baselines and does not feed the synthetic twin.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#789565"/></marker><style>text{font-family:Arial,sans-serif;fill:#294a35}.k{font-size:12px;letter-spacing:2px;fill:#7a936b}.h{font-family:Georgia,serif;font-size:25px}.b{font-size:15px;fill:#718265}.n{fill:#fafcf5;stroke:#cfddbf;stroke-width:1.5}.a{fill:none;stroke:#8ba176;stroke-width:2;marker-end:url(#arrow)}.s{font-size:13px;fill:#82936f}</style></defs>
<rect width="1500" height="930" fill="#f6f8ef"/><text x="65" y="65" class="k">RENALIS 0.4 / LOCAL RESEARCH PROTOTYPE</text><text x="65" y="120" font-family="Georgia,serif" font-size="43">Two data streams. Explicit model boundaries.</text><text x="65" y="155" class="b">Availability-aware inference, inspectable uncertainty, and a separate observed-data experiment.</text>
<rect x="65" y="215" width="265" height="155" rx="13" class="n"/><text x="86" y="247" class="k">HISTORICAL / LEARNED</text><text x="86" y="282" class="h">Preceding raw sessions</text><text x="86" y="313" class="b">Grid fit + population shrinkage</text><text x="86" y="339" class="b">Prior SD + history digest</text>
<rect x="65" y="405" width="265" height="155" rx="13" class="n"/><text x="86" y="437" class="k">DYNAMIC / TO CUTOFF</text><text x="86" y="472" class="h">Medical-device replay</text><text x="86" y="503" class="b">Valid BP · machine settings</text><text x="86" y="529" class="b">Recorded fluid removal</text>
<path d="M330 294H355V387H390M330 482H355V387" class="a"/>
<rect x="395" y="294" width="230" height="188" rx="13" fill="#e7efda" stroke="#c7d9b4"/><text x="416" y="327" class="k">AVAILABILITY GATE</text><text x="416" y="365" class="h">Known at the cutoff</text><text x="416" y="400" class="b">Exclude future observations</text><text x="416" y="429" class="b">Check quality, age, session</text><text x="416" y="458" class="s">Replay tick ≠ new cuff reading</text>
<path d="M625 388H650V285H685M650 388V487H685" class="a"/>
<rect x="690" y="215" width="300" height="155" rx="13" class="n"/><text x="712" y="247" class="k">PATIENT TWIN</text><text x="712" y="282" class="h">192 parameter particles</text><text x="712" y="313" class="b">Conservative fluid-state model</text><text x="712" y="339" class="b">Localized future low-BP forecast</text>
<rect x="690" y="405" width="300" height="185" rx="13" class="n"/><text x="712" y="437" class="k">MECHANISM LAB</text><text x="712" y="472" class="h">4 x 48 compatibility particles</text><text x="712" y="503" class="b">Rival responses · disagreement</text><text x="712" y="529" class="b">Observation value · contradiction</text><text x="712" y="562" class="s">No unreleased device value enters selection</text>
<path d="M990 294H1020V388H1050M990 493H1020V388" class="a"/>
<rect x="1055" y="285" width="375" height="210" rx="13" fill="#1c4330"/><text x="1080" y="320" class="k" style="fill:#b1c798">RESEARCH WORKSPACE &amp; LOCAL AUDIT</text><text x="1080" y="363" class="h" style="fill:#e0eccb">Inspect · compare · record</text><text x="1080" y="401" class="b" style="fill:#b8cda5">Time-gated synthetic/manual measurements</text><text x="1080" y="430" class="b" style="fill:#b8cda5">Support boundaries · authority withheld states</text><text x="1080" y="459" class="b" style="fill:#b8cda5">Append-only corrections + saved reports</text>
<rect x="65" y="650" width="1365" height="170" rx="14" fill="#e9f0ee" stroke="#ceded7"/><text x="90" y="688" class="k">SEPARATE OBSERVED-DATA LANE — NOT THE SYNTHETIC MODEL ENGINE</text><text x="90" y="733" class="h">HEMOBP v3</text><path d="M270 728H315" class="a"/><text x="340" y="733" class="h">Data audit</text><path d="M505 728H550" class="a"/><text x="575" y="733" class="h">Patient-separated baselines</text><path d="M910 728H955" class="a"/><text x="980" y="733" class="h">Retrospective evaluation</text><text x="90" y="782" class="b">Observed next-reading prediction does not validate latent mechanisms, hypothetical treatments, or clinical benefit.</text>
<text x="65" y="878" class="s">Built-in patients and device replay are synthetic. Compatibility weights are not diagnostic probabilities.</text><text x="65" y="905" class="s">Authored research assumptions; no autonomous treatment command or clinical deployment.</text></svg>
